<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>splandorf.com</title>
<meta name="description" content="A small collection of projects.">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg:#f6f4ef; --ink:#1d1b18; --muted:#6c675f; --rule:#d9d4c9; --accent:#3a3fb0; --card:#fffdf9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16151a; --ink:#ece9e2; --muted:#9a968d; --rule:#2d2b33; --accent:#9fa4ff; --card:#1e1d24; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
  main { max-width: 38rem; margin: 0 auto; padding: 14vh 1.25rem 4rem; }
  h1 { font-size: 1.05rem; font-weight: 400; letter-spacing: .02em; color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }
  a.entry { display: grid; grid-template-columns: 1fr auto; gap: .15rem 1rem; padding: 1.25rem .25rem; color: inherit; text-decoration: none; }
  a.entry:hover, a.entry:focus-visible { background: var(--card); outline: none; }
  a.entry:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .name { font-size: 1.5rem; line-height: 1.2; }
  .path { font: .85rem/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); align-self: center; }
  .what { grid-column: 1 / -1; color: var(--muted); font-size: .98rem; }
</style>
</head>
<body>
<main>
  <h1>splandorf.com</h1>
  <ul>
    <li>
      <a class="entry" href="/conlang/">
        <span class="name">Conlang Forge</span>
        <span class="path">/conlang</span>
        <span class="what">Invent languages for your fantasy world, then translate to and from them.</span>
      </a>
    </li>
    <!-- add new projects as more <li> entries here -->
  </ul>
</main>
</body>
</html>
