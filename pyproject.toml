[project]
name = "conlang-forge"
version = "0.1.0"
description = "Deterministic constructed-language generator (core engine)"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest"]
postgres = ["psycopg[binary]>=3.1"]
[project.scripts]
conlang-forge = "conlang_forge.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
